          <li>

          </li>
          <li>
            <button onclick="redirect('dashboard.html')">
              Minha dashboard
            </button>

        </ul>
      </div>
    </div>

    <div class="title-explore">
      <h2>Explorar Fotografias</h2>

      <div class="inform">
        <span
          >Explore as fotografias de outros usuários. Curta e interaja ❤️</span
        >
      </div>
    </div>

    <div class="container-gallery">
      <div class="gallery" id="gallery"></div>
    </div>

    <div id="more-content"></div>

    <div class="modalJaCurtido" id="jaCurtido">
      <div class="content">
        <?xml version="1.0" encoding="UTF-8" standalone="no"?>
        <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->

    <div class="modalJaCurtido" id="curtiu">
      <div class="content">
        <?xml version="1.0" encoding="utf-8"?>
        <svg
          width="25"
          height="25"
          viewBox="0 0 25 25"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g>
            <path
              d="M12.5 21.875C12.5 21.875 23.0584 11.3166 23.0584 11.3166C24.3016 10.0734 25 8.38728 25 6.62913C25 6.62913 25 6.33178 25 6.33178C25 2.83484 22.1652 0 18.6683 0C16.7447 0 14.9255 0.874359 13.7239 2.37634C13.7239 2.37634 12.5 3.90625 12.5 3.90625C12.5 3.90625 11.2761 2.37634 11.2761 2.37634C10.0745 0.874359 8.25528 0 6.33178 0C2.83484 0 0 2.83484 0 6.33178C0 6.33178 0 6.62913 0 6.62913C0 8.38728 0.698422 10.0734 1.94162 11.3166C1.94162 11.3166 12.5 21.875 12.5 21.875Z"
              fill="#FF0000"

              transform="translate(0 1.563)"
            />
          </g>
        </svg>
        <span>Você curtiu esse post</span>
      </div>
    </div>

    <div class="modalComentario" id="modalComentario">
      <form>
        <span id="titulo_post">Título do post</span>
        <br />
        <span id="usuario_do_post">Usuário</span>
        <div class="" id="msgComentarios"></div>
        <div class="input-area">
          <label>Comente este post:</label>
          <textarea
            type="text"
            id="comentarioValor"
            placeholder="Digite seu comentário"
            required
          ></textarea>
        </div>
        <div class="buttons-comentario">
          <button
            type="button"
            onclick="cancelarComentario()"
            id="cancelar-comentario"
          >
            Cancelar
          </button>
          <button type="button" id="publicarComentario">
            Publicar comentário
          </button>
        </div>
      </form>
    </div>

    <script src="assets/javascript/session.js"></script>

    <script>
      if (sessionStorage.EMAIL_USUARIO == null) {
        window.location.href = "register.html";
      }

      var msgSemPost = `<span class="nothing">Não há nada ainda por aqui. <a class="goto" onclick="redirect('profile.html')">Poste sua fotografia</a></span>`;

      function redirect(url) {
        window.location.href = url;
      }

      function logout() {
        sessionStorage.clear();
        redirect("login.html");
      }

      document.addEventListener("DOMContentLoaded", listartPosts());

      // Listar todos os posts
      function listartPosts() {
        var id = sessionStorage.ID_USUARIO;
        fetch(`/posts/listaTudoMenosEu/${id}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            id: id,
          }),
        }).then(function (resposta) {
          console.log("Buscando posts que não sejam do usuario: ", id);
          if (resposta.ok) {
            console.log(resposta);
            resposta.json().then((json) => {
              console.log(json);

              sessionStorage.TODOS_POSTS = JSON.stringify(json);
              var posts = JSON.parse(sessionStorage.TODOS_POSTS);

              if (posts.length == 0) {
                document.getElementById("gallery").innerHTML = msgSemPost;
              }

              posts.forEach((post) => {
                document.getElementById("gallery").innerHTML += `
                    <div class="image up">
                            <div class="image-overlay" id="${post.idPost}">
                              <span class="likes">
                                <div class="item">
                                  <span id="titulo-${post.idPost}">${post.titulo}</span>
                                </div>
                                <div class="item">
                                  <span id="usuario_post-${post.idPost}">@${post.usuario}</span>
                                </div>
                              <span>
                              <div class="like" title="Curtir post" onclick="like(${post.idPost})">
                                <?xml version="1.0" encoding="utf-8"?>
                                <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                                  <g>
                                    <path d="M12.5 21.875C12.5 21.875 23.0584 11.3166 23.0584 11.3166C24.3016 10.0734 25 8.38728 25 6.62913C25 6.62913 25 6.33178 25 6.33178C25 2.83484 22.1652 0 18.6683 0C16.7447 0 14.9255 0.874359 13.7239 2.37634C13.7239 2.37634 12.5 3.90625 12.5 3.90625C12.5 3.90625 11.2761 2.37634 11.2761 2.37634C10.0745 0.874359 8.25528 0 6.33178 0C2.83484 0 0 2.83484 0 6.33178C0 6.33178 0 6.62913 0 6.62913C0 8.38728 0.698422 10.0734 1.94162 11.3166C1.94162 11.3166 12.5 21.875 12.5 21.875Z" fill="#FF0000" fill-rule="evenodd" transform="translate(0 1.563)" />
                                  </g>
                                </svg>
                              </div>
                              <div class="like" title="Comentar post" onclick="comentar(${post.idPost})">
                                <?xml version="1.0" encoding="utf-8"?>
                                <svg width="25" height="25" viewBox="0 0 25 25" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                                  <g>
                                    <path d="M18.75 0C18.75 0 0 0 0 0L0 15.625L6.25 15.625L9.375 18.75L12.5 15.625L18.75 15.625C18.75 15.625 18.75 0 18.75 0Z" fill="##ffffff" fill-rule="evenodd" transform="translate(6.25 1.563)"></path>
                                    <path d="M3.125 0C3.125 0 3.125 12.5 3.125 12.5L11.2056 12.5L13.6049 14.8992L11.3951 17.1089L9.91117 15.625L0 15.625L0 0C0 0 3.125 0 3.125 0Z" fill="#ffffff" fill-rule="evenodd" transform="translate(0 7.813)"></path>
                                  </g>
                                </svg>
                              </div>
                            </div>
                            <img id="imagem-${post.idPost}" src="/assets/uploads/images/${post.foto_path}" alt=""/>
                        </div>
                    `;
              });
            });

            document.getElementById(
              "more-content"
            ).innerHTML = `<p>Parece que você viu todos os posts</p>`;
          }
        });
      }

      // Exibir a mensagem de já curtido
      function jaCurtido() {
        document.getElementById("jaCurtido").style.display = "flex";
        setTimeout(() => {
          document.getElementById("jaCurtido").style.display = "none";
        }, 2500);
      }

      // CUrtiu post
      function curtiuPost() {
        document.getElementById("curtiu").style.display = "flex";
        setTimeout(() => {
          document.getElementById("curtiu").style.display = "none";
        }, 2500);
      }

      // FUnção para abrir modal e comentar post
      function comentar(idPost) {
        document.getElementById("msgComentarios").innerHTML = "";

        var modal = (document.getElementById("modalComentario").style.display =
          "flex");

        var usuarioPost = document.getElementById(
          `usuario_post-${idPost}`
        ).innerHTML;
        var tituloPost = document.getElementById(`titulo-${idPost}`).innerHTML;
        var postId = document.getElementById(`${idPost}`);

        document.getElementById("titulo_post").innerHTML = tituloPost;
        document.getElementById("usuario_do_post").innerHTML = usuarioPost;
        document
          .getElementById("publicarComentario")
          .addEventListener("click", () => {
            publicarComentario(idPost);
          });

        // Carregar os posts
        fetch(`posts/listarComentarios/${idPost}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            idPost: idPost,
          }),
        })
          .then(function (resposta) {
            console.log("Listand os posts");
            if (resposta.ok) {
              resposta.json().then((json) => {
                sessionStorage.COMENTARIOS = JSON.stringify(json);
                var comentarios = JSON.parse(sessionStorage.COMENTARIOS);

                if (comentarios.length == 0) {
                  document.getElementById(
                    "msgComentarios"
                  ).innerHTML = `<p class="not-comments">Nenhum comentário ainda</p>`;
                } else {
                  comentarios.forEach((comentario) => {
                    document.getElementById("msgComentarios").innerHTML += `
                    <div class="comentario">
                    <?xml version="1.0" encoding="utf-8"?><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16 1H4V11H8L10 13L12 11H16V1Z" fill="#000000"/>
                      <path d="M2 5V13H7.17157L8.70711 14.5355L7.29289 15.9497L6.34315 15H0V5H2Z" fill="#000000"/>
                    </svg>
                      <span class="comentario-conteudo">${comentario.ConteudoComentario}</span>
                      <span class="user-comentario">@${comentario.usuario}</span>
                      <span class="data-hora">${comentario.data_hora}</span>
                    </div><br>
                  `;
                  });
                }
              });
            }
          })
          .catch(function (erro) {
            console.log(erro);
          });
      }

      // Função para cencelar comentario
      function cancelarComentario() {
        document.getElementById("modalComentario").style.display = "none";
      }

      // FUnção para comentar post
      function publicarComentario(idPost) {
        var idUsuario = sessionStorage.ID_USUARIO;
        var comentario = document.getElementById("comentarioValor").value;

        fetch(`posts/comentar/${idPost}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            idPost: idPost,
            idUsuario: idUsuario,
            comentario: comentario,
          }),
        })
          .then(function (resposta) {
            console.log("Comentando um post");
            if (resposta.ok) {
              console.log("Comentou");
              console.log(resposta);
              window.location.reload(true);
            }
          })
          .catch(function (erro) {
            console.log("OCorreu um erro ao comentar post");
          });
      }

      // Função para curtir post
      function like(idPost) {
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`posts/curtir/${idPost}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            idUsuario: idUsuario,
            idPost: idPost,
          }),
        })
          .then(function (resposta) {
            console.log("Curtindo um post");
            if (resposta.ok) {
              console.log(resposta);
              resposta.json().then((json) => {
                sessionStorage.POSTS_CURTIDOS = JSON.stringify(json);
                curtiuPost();
              });
            } else {
              jaCurtido();
            }
          })
          .catch(function (erro) {
            console.log(erro);
          });
      }
    </script>
  </body>
</html>
