    <div class="title-explore">
      <h2>Explorar</h2>

      <div class="inform">
        <span>Explore as fotografias de outros usuários</span>
      </div>
    </div>

    <div class="container-gallery">
      <div class="gallery" id="gallery"></div>
    </div>

    <script src="assets/javascript/session.js"></script>

    <script>
      if (sessionStorage.EMAIL_USUARIO == null) {
        window.location.href = "register.html";
      }

      var msgSemPost = `<span class="nothing">Não há nada ainda por aqui. <a class="goto" onclick="redirect('profile.html')">Poste sua fotografia</a></span>`;

      function redirect(url) {
        window.location.href = url;
      }

      document.addEventListener("DOMContentLoaded", listartPosts());

      // Listar todos os posts
      function listartPosts() {
        fetch("/posts/listarTudo", {
          method: "GET",
        }).then(function (resposta) {
          if (resposta.ok) {
            console.log(resposta);
            resposta.json().then((json) => {
              console.log(json);

              sessionStorage.TODOS_POSTS = JSON.stringify(json);
              var posts = JSON.parse(sessionStorage.TODOS_POSTS);

              if (posts.length == 0) {
                document.getElementById("gallery").innerHTML = msgSemPost;
              }

              posts.forEach((post) => {
                document.getElementById(
                  "gallery"
                ).innerHTML += `                     
                    <div class="image up">
                            <div class="image-overlay" id="imagem-${post.id}" onclick="abrirModal(${post.id})">
                              <span class="likes">
                                <div class="item">
                                  <span>${post.titulo}</span>
                                </div>

                                <div class="item">
                                  <span>@${post.usuario}</span>
                                </div>
                              <span>
                            </div>
                            <img src="/assets/uploads/images/${post.foto_path}" alt=""/>
                        </div>
                    `;
              });
            });
          }
        });
      }
    </script>
  </body>
